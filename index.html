>
  Text a Friend
</a>

<!-- SHARE WITH A FRIEND -->
<button id="shareButton" type="button">
  Share with a Friend
</button>

<script>
document.getElementById("shareButton").addEventListener("click", async () => {

  const shareData = {
    text: "Hey! I thought you might be interested in checking out BYU-Idaho. I really love it here, and I think you'd enjoy seeing the campus. You can sign up for a fun campus tour at",
    url: "https://byui.edu/campus-tours"
  };

  try {
    if (navigator.share) {
      await navigator.share(shareData);
    } else {
      await navigator.clipboard.writeText(
        shareData.text + " " + shareData.url
      );

      alert("Invitation copied to your clipboard.");
    }
  } catch (error) {
    console.log("Share canceled or failed:", error);
  }
});
</script>
